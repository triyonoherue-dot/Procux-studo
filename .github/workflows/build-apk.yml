                                          enabled = state.imageOverlay.bitmap != null,
                                          onClick = {
                                              val bmp = state.imageOverlay.bitmap ?: return@OutlinedButton
                                              statusMsg = "Memproses AI Auto Cutout..."
                                              SmartTools.runAutoCutout(
                                                  source = bmp,
                                                  onSuccess = { cutout ->
                                                      state = state.copy(imageOverlay = state.imageOverlay.copy(bitmap = cutout))
                                                      statusMsg = "Background gambar berhasil dihapus!"
                                                  },
                                                  onError = { err -> statusMsg = err }
                                              )
                                          }
                                      ) {
                                          Icon(Icons.Default.AutoAwesome, null, modifier = Modifier.size(16.dp))
                                          Spacer(Modifier.width(4.dp))
                                          Text("AI Auto Cutout")
                                      }
                                  }
                                  Text("Ukuran Overlay: ${"%.2f".format(state.imageOverlay.scale)}", fontSize = 12.sp)
                                  Slider(value = state.imageOverlay.scale, onValueChange = { state = state.copy(imageOverlay = state.imageOverlay.copy(scale = it)) }, valueRange = 0.1f..1f)

                                  Text("Opasitas (Alpha): ${"%.2f".format(state.imageOverlay.alpha)}", fontSize = 12.sp)
                                  Slider(value = state.imageOverlay.alpha, onValueChange = { state = state.copy(imageOverlay = state.imageOverlay.copy(alpha = it)) }, valueRange = 0.1f..1f)

                                  Text("Posisi X: ${"%.2f".format(state.imageOverlay.posX)}", fontSize = 12.sp)
                                  Slider(value = state.imageOverlay.posX, onValueChange = { state = state.copy(imageOverlay = state.imageOverlay.copy(posX = it)) }, valueRange = -0.8f..0.8f)

                                  Text("Posisi Y: ${"%.2f".format(state.imageOverlay.posY)}", fontSize = 12.sp)
                                  Slider(value = state.imageOverlay.posY, onValueChange = { state = state.copy(imageOverlay = state.imageOverlay.copy(posY = it)) }, valueRange = -0.8f..0.8f)
                              }

                              EditorTab.TEXT -> {
                                  OutlinedTextField(
                                      value = state.textOverlay.text,
                                      onValueChange = { state = state.copy(textOverlay = state.textOverlay.copy(text = it)) },
                                      label = { Text("Teks / Subtitle Layar") },
                                      modifier = Modifier.fillMaxWidth()
                                  )
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Button(onClick = {
                                          val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                                              putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                              putExtra(RecognizerIntent.EXTRA_LANGUAGE, "id-ID")
                                              putExtra(RecognizerIntent.EXTRA_PROMPT, "Ucapkan teks subtitle...")
                                          }
                                          try {
                                              speechLauncher.launch(intent)
                                          } catch (_: Exception) {
                                              statusMsg = "Layanan Speech-to-Text tidak tersedia"
                                          }
                                      }) {
                                          Icon(Icons.Default.Mic, null, modifier = Modifier.size(16.dp))
                                          Spacer(Modifier.width(4.dp))
                                          Text("Auto Captions")
                                      }
                                      FilterChip(
                                          selected = state.textOverlay.hasBox,
                                          onClick = { state = state.copy(textOverlay = state.textOverlay.copy(hasBox = !state.textOverlay.hasBox)) },
                                          label = { Text("Kotak Latar") }
                                      )
                                  }
                                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                      listOf(AndroidColor.WHITE, AndroidColor.YELLOW, AndroidColor.CYAN, AndroidColor.GREEN).forEach { c ->
                                          Box(
                                              modifier = Modifier
                                                  .size(28.dp)
                                                  .clip(CircleShape)
                                                  .background(Color(c))
                                                  .border(2.dp, if (state.textOverlay.colorHex == c) Color.Magenta else Color.Gray, CircleShape)
                                                  .clickable { state = state.copy(textOverlay = state.textOverlay.copy(colorHex = c)) }
                                          )
                                      }
                                  }
                                  Text("Posisi Vertikal Teks", fontSize = 12.sp)
                                  Slider(value = state.textOverlay.posY, onValueChange = { state = state.copy(textOverlay = state.textOverlay.copy(posY = it)) }, valueRange = -0.85f..0.85f)
                              }

                              EditorTab.AUDIO -> {
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Button(onClick = { audioPicker.launch(arrayOf("audio/*")) }) {
                                          Text(if (state.audio.bgmUri == null) "Tambah Musik BGM" else "Ganti BGM")
                                      }
                                      Button(
                                          colors = ButtonDefaults.buttonColors(
                                              containerColor = if (isRecording) Color(0xFFFF5252) else MaterialTheme.colorScheme.secondary
                                          ),
                                          onClick = {
                                              if (!isRecording) {
                                                  micPermissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                                              } else {
                                                  val voUri = recorder.stop()
                                                  isRecording = false
                                                  if (voUri != null) {
                                                      state = state.copy(audio = state.audio.copy(voiceoverUri = voUri))
                                                      statusMsg = "Voiceover tersimpan di jalur audio"
                                                  }
                                              }
                                          }
                                      ) {
                                          Icon(if (isRecording) Icons.Default.Stop else Icons.Default.Mic, null, modifier = Modifier.size(16.dp))
                                          Spacer(Modifier.width(4.dp))
                                          Text(if (isRecording) "Stop Rekam" else "Voiceover")
                                      }
                                  }

                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Checkbox(
                                          checked = state.audio.muteOriginal,
                                          onCheckedChange = { state = state.copy(audio = state.audio.copy(muteOriginal = it)) }
                                      )
                                      Text("Bisukan Suara Asli Video", fontSize = 12.sp)
                                  }

                                  Text("Volume: ${(state.audio.volume * 100).toInt()}%", fontSize = 12.sp)
                                  Slider(value = state.audio.volume, onValueChange = { state = state.copy(audio = state.audio.copy(volume = it)) }, valueRange = 0f..2f)

                                  Text("Pitch Suara: ${"%.2f".format(state.audio.pitch)}x", fontSize = 12.sp)
                                  Slider(value = state.audio.pitch, onValueChange = { state = state.copy(audio = state.audio.copy(pitch = it)) }, valueRange = 0.5f..2f)

                                  Text("Noise Reduction (Peredam Bising): ${(state.audio.noiseReduction * 100).toInt()}%", fontSize = 12.sp)
                                  Slider(value = state.audio.noiseReduction, onValueChange = { state = state.copy(audio = state.audio.copy(noiseReduction = it)) }, valueRange = 0f..0.25f)

                                  HorizontalDivider()
                                  Text("Text-to-Speech (TTS Offline)", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  OutlinedTextField(
                                      value = ttsInput,
                                      onValueChange = { ttsInput = it },
                                      label = { Text("Tulis teks untuk narator...") },
                                      modifier = Modifier.fillMaxWidth()
                                  )
                                  Button(onClick = {
                                      statusMsg = "Membuat audio TTS..."
                                      SmartTools.synthesizeOfflineTts(
                                          context = context,
                                          text = ttsInput,
                                          onSuccess = { uri ->
                                              state = state.copy(audio = state.audio.copy(ttsUri = uri))
                                              statusMsg = "Audio TTS berhasil ditambahkan!"
                                          },
                                          onError = { err -> statusMsg = err }
                                      )
                                  }) {
                                      Icon(Icons.Default.RecordVoiceOver, null, modifier = Modifier.size(16.dp))
                                      Spacer(Modifier.width(6.dp))
                                      Text("Generate Suara TTS")
                                  }
                              }

                              EditorTab.SCRIPT -> {
                                  Text("Script-to-Video Otomatis (Offline)", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                  Text(
                                      "Ketik naskah singkat. Aplikasi akan otomatis membuat latar video 9:16, audio narator TTS, dan teks subtitle.",
                                      fontSize = 12.sp,
                                      color = Color(0xFF94A3B8)
                                  )
                                  OutlinedTextField(
                                      value = scriptInput,
                                      onValueChange = { scriptInput = it },
                                      label = { Text("Masukkan naskah video di sini...") },
                                      minLines = 3,
                                      modifier = Modifier.fillMaxWidth()
                                  )
                                  Button(
                                      modifier = Modifier.fillMaxWidth(),
                                      onClick = {
                                          if (scriptInput.isBlank()) {
                                              statusMsg = "Tulis naskah terlebih dahulu"
                                              return@Button
                                          }
                                          statusMsg = "Merakit video dari naskah..."
                                          val bgUri = SmartTools.createScriptBackground(context)
                                          val estDuration = (scriptInput.length * 90L).coerceIn(4000L, 20000L)
                                          val scriptClip = VideoClip(
                                              uri = bgUri,
                                              label = "Script Scene",
                                              isImage = true,
                                              durationMs = estDuration,
                                              trimEndMs = estDuration
                                          )
                                          SmartTools.synthesizeOfflineTts(
                                              context = context,
                                              text = scriptInput,
                                              onSuccess = { ttsUri ->
                                                  state = state.copy(
                                                      clips = listOf(scriptClip),
                                                      selectedClipIndex = 0,
                                                      textOverlay = state.textOverlay.copy(text = scriptInput, posY = 0f),
                                                      audio = state.audio.copy(ttsUri = ttsUri)
                                                  )
                                                  statusMsg = "Script-to-Video siap diekspor!"
                                              },
                                              onError = { err -> statusMsg = err }
                                          )
                                      }
                                  ) {
                                      Icon(Icons.Default.AutoAwesome, null)
                                      Spacer(Modifier.width(6.dp))
                                      Text("Buat Video dari Naskah")
                                  }
                              }
                          }
                      }
                  }
              }

              if (showExportDialog) {
                  AlertDialog(
                      onDismissRequest = { showExportDialog = false },
                      title = { Text("Pengaturan Ekspor Video") },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("Resolusi:", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  listOf(720 to "720p", 1080 to "1080p", 2160 to "4K").forEach { (h, label) ->
                                      FilterChip(
                                          selected = state.exportConfig.height == h,
                                          onClick = { state = state.copy(exportConfig = state.exportConfig.copy(height = h)) },
                                          label = { Text(label) }
                                      )
                                  }
                              }
                              Text("Frame Rate (FPS):", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  listOf(24, 30, 60).forEach { fps ->
                                      FilterChip(
                                          selected = state.exportConfig.fps == fps,
                                          onClick = { state = state.copy(exportConfig = state.exportConfig.copy(fps = fps)) },
                                          label = { Text("$fps FPS") }
                                      )
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          Button(onClick = {
                              showExportDialog = false
                              exportProgress = 0
                              statusMsg = "Memulai render video..."
                              ProEffectsEngine.exportVideo(
                                  context = context,
                                  state = state,
                                  onProgress = { p -> exportProgress = p },
                                  onSuccess = { path ->
                                      exportProgress = null
                                      statusMsg = "Tersimpan: $path"
                                      Toast.makeText(context, "Berhasil diekspor ke $path", Toast.LENGTH_LONG).show()
                                  },
                                  onError = { err ->
                                      exportProgress = null
                                      statusMsg = "Error: $err"
                                      Toast.makeText(context, "Gagal: $err", Toast.LENGTH_LONG).show()
                                  }
                              )
                          }) {
                              Text("Mulai Ekspor")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { showExportDialog = false }) { Text("Batal") }
                      }
                  )
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProCut-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
